<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf4e9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="icon" href="/icon.png" />
    <link rel="stylesheet" href="/style.css" />
    <title>Forestock · Purchasing</title>
  </head>
  <body>
    <header>
      <div class="brand">
        <button class="bird mark" aria-label="Animate the Forestock sparrow">
          <span></span></button
        >Forestock
      </div>
      <button id="openWallet" type="button">Set up wallet</button>
    </header>
    <section id="welcome" aria-labelledby="welcomeTitle">
      <div class="chat-heading">
        <button class="bird portrait" aria-label="Animate the copper-winged sparrow"><span></span></button>
        <div><h1 id="welcomeTitle">Plan an order</h1><p>With your AI purchasing helper</p></div>
      </div>
      <div id="messages" role="log" aria-label="Setup conversation" aria-live="polite"></div>
      <div class="reply-area">
        <div id="suggestions" aria-label="Suggested replies"></div>
        <form id="setup" autocomplete="off">
          <input name="reply" aria-label="Your message" maxlength="1000" required />
          <button class="primary">Send</button>
        </form>
        <button id="restart" type="button" hidden>Start over</button>
      </div>
    </section>
    <main hidden id="app" aria-live="polite">Loading orders…</main>
    <nav hidden aria-label="Workspace">
      <button data-tab="Orders">Orders</button
      ><button data-tab="Budget">Budget</button
      ><button data-tab="Activity">Activity</button>
    </nav>
    <dialog id="walletPanel" aria-labelledby="walletTitle">
      <h2 id="walletTitle">Your Arc Testnet wallet</h2>
      <p role="status"></p>
      <output aria-label="Wallet address" hidden></output>
      <div class="actions" hidden>
        <button data-register class="primary">Create passkey wallet</button>
        <button data-login>Use existing passkey</button>
      </div>
      <p class="hint">Purchasing uses a separate demo balance.</p>
      <button data-dismiss>Close</button>
    </dialog>
    <dialog id="editor">
      <form id="orderForm">
        <h2>Material need</h2>
        <label>Commodity<select name="asset"></select></label>
        <label
          >Quantity required (<span data-unit>lb</span>)<input
            name="qty"
            type="number"
            min="1"
            max="10000"
            required /></label
        ><label
          >Maximum delivered price ($/<span data-unit>lb</span>)<input
            name="cap"
            type="number"
            min=".01"
            max="10000000"
            step=".01"
            required /></label
        ><label
          >Needed by (local time)<input
            type="datetime-local"
            name="due"
            required /></label
        ><label
          >Receiving notes<textarea name="notes" maxlength="300"></textarea>
        </label>
        <p>Demo supplier · simulated supplier · 24-hour lead time</p>
        <div class="actions">
          <button type="button" data-close>Cancel</button
          ><button class="primary">Save need</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/wallet.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
