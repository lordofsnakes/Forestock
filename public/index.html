<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#faf4e9"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icon.png"><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/style.css"><title>Forestock · Purchasing</title></head><body><header><div class="brand"><img src="/sparrow.jpg" alt="">Forestock</div><span class="tag">Demo workspace</span></header><main id="app" aria-live="polite">Loading orders…</main><nav aria-label="Workspace"><button data-tab="Orders">▤　Orders</button><button data-tab="Budget">▣　Budget</button><button data-tab="Activity">◷　Activity</button></nav><dialog id="editor"><form id="orderForm"><h2>Material need</h2><label>Copper required (lb)<input name="qty" type="number" min="1" max="10000" required></label><label>Maximum delivered price ($/lb)<input name="cap" type="number" min=".01" max="100" step=".01" required></label><label>Needed by (local time)<input type="datetime-local" name="due" required></label><label>Receiving notes<textarea name="notes" maxlength="300"></textarea></label><p>Central Metals · simulated supplier · 24-hour lead time</p><div class="actions"><button type="button" data-close>Cancel</button><button class="primary">Save need</button></div></form></dialog><script type="module" src="/app.js"></script></body></html>
