<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf4e9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="icon" href="/icon.png" />
    <link rel="stylesheet" href="/style.css" />
    <title>Forestock · Purchasing</title>
  </head>
  <body>
    <header>
      <div class="brand">
        <button class="bird mark" aria-label="Animate the Forestock sparrow">
          <span></span></button
        >Forestock
      </div>
    </header>
    <section id="welcome" aria-labelledby="welcomeTitle">
      <div class="intro">
        <div>
          <h1 id="welcomeTitle">Plan an order</h1>
        </div>
        <button
          class="bird portrait"
          aria-label="Animate the copper-winged sparrow"
        >
          <span></span>
        </button>
      </div>
      <p class="intro-copy">
        Choose a material and budget to see when to buy.
      </p>
      <form id="setup">
        <fieldset id="materialStep">
          <legend tabindex="-1">1 of 2 · Material need</legend>
          <label>Commodity<select name="asset"></select></label>
          <label>Quantity needed (<span data-unit>lb</span>)
            <input name="quantity" type="number" min="1" max="10000" required />
          </label>
        </fieldset>
        <fieldset id="allowanceStep" hidden disabled>
          <legend tabindex="-1">2 of 2 · Spending allowance</legend>
          <label>Weekly allowance (test USDC)
            <input name="allowance" type="number" min="0" max="100000" step=".01" required />
          </label>
          <p class="hint" id="balanceHint"></p>
        </fieldset>
        <div class="setup-actions">
          <button id="setupBack" type="button" hidden>Back</button>
          <button class="primary" type="submit">
            <span id="setupAction">Next</span> <span aria-hidden="true">→</span>
          </button>
        </div>
      </form>
    </section>
    <main hidden id="app" aria-live="polite">Loading orders…</main>
    <nav hidden aria-label="Workspace">
      <button data-tab="Orders">Orders</button
      ><button data-tab="Budget">Budget</button
      ><button data-tab="Activity">Activity</button>
    </nav>
    <dialog id="editor">
      <form id="orderForm">
        <h2>Material need</h2>
        <label>Commodity<select name="asset"></select></label>
        <label
          >Quantity required (<span data-unit>lb</span>)<input
            name="qty"
            type="number"
            min="1"
            max="10000"
            required /></label
        ><label
          >Maximum delivered price ($/<span data-unit>lb</span>)<input
            name="cap"
            type="number"
            min=".01"
            max="10000000"
            step=".01"
            required /></label
        ><label
          >Needed by (local time)<input
            type="datetime-local"
            name="due"
            required /></label
        ><label
          >Receiving notes<textarea name="notes" maxlength="300"></textarea>
        </label>
        <p>Demo supplier · simulated supplier · 24-hour lead time</p>
        <div class="actions">
          <button type="button" data-close>Cancel</button
          ><button class="primary">Save need</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/app.js"></script>
  </body>
</html>
